<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Análises IA | Fisio Smart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="analytics">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🖐️</div>
        <div>
          <h2>Fisio Smart</h2>
          <p>Análise de Movimento</p>
        </div>
      </div>
      <nav class="menu">
        <a href="overview.html" class="menu-button" data-page="overview">Visão Geral</a>
        <a href="live.html" class="menu-button" data-page="live">Sessão ao Vivo</a>
        <a href="history.html" class="menu-button" data-page="history">Histórico</a>
        <a href="analytics.html" class="menu-button" data-page="analytics">Análises IA</a>
      </nav>
      <button id="logoutButton" class="secondary-button">Sair</button>
    </aside>
    <main class="main-content">
      <div class="section-header">
        <div>
          <h1>Análises IA</h1>
          <p>Resumo de desempenho e resultados do último período.</p>
        </div>
      </div>
      <!-- PAINEL DE ANÁLISE COM IA -->
      <div class="panel card" style="margin-bottom: 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 24px; border-radius: 14px;">
        <h2 style="margin-top: 0;">🤖 Análise Inteligente com IA</h2>
        <p>Gere análises personalizadas usando inteligência artificial</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
          <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Tipo de Análise</label>
            <select id="analysisType" style="width: 100%; padding: 10px; border-radius: 8px; border: none;">
              <option value="movement">Análise de Movimento</option>
              <option value="progress">Relatório de Progresso</option>
              <option value="exercises">Recomendações de Exercícios</option>
            </select>
          </div>
          <div>
            <label style="display: block; margin-bottom: 8px; font-weight: 600;">Paciente</label>
            <input type="text" id="patientName" placeholder="Nome do paciente" style="width: 100%; padding: 10px; border-radius: 8px; border: none;">
          </div>
        </div>

        <button id="analyzeBtn" class="primary-button" style="margin-top: 16px; width: 100%; background: white; color: #667eea; font-weight: 600;">
          Gerar Análise
        </button>
      </div>

      <!-- RESULTADO DA ANÁLISE -->
      <div id="aiResult" class="panel card" style="display: none; margin-bottom: 24px; background: #f0f9ff; border-left: 4px solid #0ea5e9;">
        <h3 style="margin-top: 0; color: #0369a1;">📊 Resultado da Análise</h3>
        <div id="aiContent" style="line-height: 1.8; color: #1e293b; white-space: pre-wrap; font-size: 14px;"></div>
        <button id="closeResultBtn" style="margin-top: 16px; padding: 10px 16px; background: #e0e7ff; color: #4338ca; border: none; border-radius: 8px; cursor: pointer;">
          Fechar
        </button>
      </div>

      <div class="cards-grid" id="analyticsCards"></div>
      <div class="panel card">
        <h3>Distribuição de Progresso</h3>
        <div class="progress-bars" id="analyticsBars"></div>
      </div>
    </main>
  </div>
  <script src="Backend/scriptgeral.js"></script>
  <script type="module" src="Backend/analytics.js"></script>
</body>
</html>
