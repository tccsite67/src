<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações - Fisio Smart</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .settings-container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .settings-container h1 {
      margin-bottom: 30px;
      color: #1f2937;
    }

    .setting-group {
      margin-bottom: 30px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #374151;
    }

    .setting-group input,
    .setting-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      font-family: monospace;
    }

    .setting-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .setting-group input:focus,
    .setting-group textarea:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .info-box {
      background: #fef3c7;
      border-left: 4px solid #f59e0b;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #92400e;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 30px;
    }

    .settings-container button {
      flex: 1;
    }

    .test-button {
      background: #10b981;
      color: white;
    }

    .test-button:hover {
      background: #059669;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      display: block;
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }
  </style>
</head>

<body style="background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);">

  <div class="settings-container">

    <h1>⚙️ Configurações - OpenAI API</h1>

    <div class="info-box">
      <strong>Como obter sua chave:</strong>
      <ol style="margin: 10px 0 0 0; padding-left: 20px;">
        <li>Acesse <a href="https://platform.openai.com/api/keys" target="_blank" style="color: #1f2937;">platform.openai.com</a></li>
        <li>Faça login na sua conta</li>
        <li>Clique em "Create new secret key"</li>
        <li>Copie e cole aqui (seguro em localStorage)</li>
      </ol>
    </div>

    <form id="settingsForm">

      <div class="setting-group">
        <label for="apiKey">Chave API OpenAI</label>
        <input
          type="password"
          id="apiKey"
          placeholder="sk-..."
          autocomplete="off"
        />
        <small style="color: #6b7280; margin-top: 5px; display: block;">
          Sua chave é armazenada localmente e nunca enviada para terceiros
        </small>
      </div>

      <div class="button-group">
        <button type="submit" class="primary-button">
          Salvar Configuração
        </button>
        <button type="button" class="test-button" id="testButton">
          Testar Conexão
        </button>
      </div>

    </form>

    <div id="status" class="status"></div>

  </div>

  <script type="module" src="Backend/settings.js"></script>

</body>

</html>
