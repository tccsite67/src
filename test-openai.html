<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste OpenAI API - Fisio Smart</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .test-container {
      max-width: 600px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .test-result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }

    .test-result.success {
      display: block;
      background: #d1fae5;
      border: 1px solid #6ee7b7;
      color: #065f46;
    }

    .test-result.error {
      display: block;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #eee;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body style="background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);">

  <div class="test-container">
    <h1>🧪 Teste de Conexão OpenAI</h1>

    <div style="background: #fef3c7; padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 4px solid #f59e0b;">
      <strong>Status:</strong> Sua chave já está configurada!
    </div>

    <button id="testBtn" class="primary-button" style="width: 100%;">
      Testar Conexão com OpenAI
    </button>

    <div id="testResult" class="test-result"></div>

    <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
      <h3>Próximos Passos:</h3>
      <ol>
        <li>Clique em "Testar Conexão" acima</li>
        <li>Se funcionar, vá para <strong>Análises IA</strong></li>
        <li>Use os formulários para gerar análises automáticas</li>
      </ol>
      <a href="analytics.html" class="primary-button" style="display: inline-block; margin-top: 15px;">
        ➜ Ir para Análises IA
      </a>
    </div>
  </div>

  <script type="module">
    import { callOpenAI } from "./Backend/openai.js";

    const testBtn = document.getElementById("testBtn");
    const testResult = document.getElementById("testResult");

    testBtn.addEventListener("click", async () => {
      testBtn.disabled = true;
      testBtn.innerHTML = '<span class="spinner"></span>Testando...';

      try {
        const response = await callOpenAI(
          "Responda com: 'Conectado com sucesso!' e nada mais."
        );

        testResult.innerHTML = `
          <h3>✅ Sucesso!</h3>
          <p><strong>Resposta da IA:</strong></p>
          <p style="background: white; padding: 15px; border-radius: 6px; font-style: italic;">"${response}"</p>
          <p style="margin-top: 15px; font-size: 14px;">Sua integração com OpenAI está funcionando perfeitamente!</p>
        `;
        testResult.className = "test-result success";

      } catch (error) {
        testResult.innerHTML = `
          <h3>❌ Erro na Conexão</h3>
          <p><strong>Mensagem:</strong> ${error.message}</p>
          <p style="font-size: 12px; margin-top: 10px;">Verifique se:</p>
          <ul style="font-size: 12px; margin: 10px 0;">
            <li>Sua chave API está correta</li>
            <li>Você tem créditos na conta OpenAI</li>
            <li>Sua conexão com a internet está ativa</li>
          </ul>
        `;
        testResult.className = "test-result error";
      }

      testBtn.disabled = false;
      testBtn.textContent = "Testar Conexão com OpenAI";
    });
  </script>

</body>
</html>
