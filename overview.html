<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visão Geral | Fisio Smart</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="overview">
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🖐️</div>
        <div>
          <h2>Fisio Smart</h2>
          <p>Análise de Movimento</p>
        </div>
      </div>
      <nav class="menu">
        <a href="overview.html" class="menu-button" data-page="overview">Visão Geral</a>
        <a href="live.html" class="menu-button" data-page="live">Sessão ao Vivo</a>
        <a href="history.html" class="menu-button" data-page="history">Histórico</a>
        <a href="analytics.html" class="menu-button" data-page="analytics">Análises IA</a>
      </nav>
      <button id="logoutButton" class="secondary-button">Sair</button>
    </aside>
    <main class="main-content">
      <div class="section-header">
        <div>
          <h1>Visão Geral</h1>
          <p>Acompanhamento em tempo real dos dados da luva fisioterapêutica</p>
        </div>
      </div>
      <div class="cards-grid" id="overviewCards"></div>
      <div class="cards-grid two-columns">
        <div class="panel card">
          <h3>Sessões da Semana</h3>
          <div class="bar-chart" id="sessionsChart"></div>
        </div>
        <div class="panel card">
          <h3>Análise de Movimento (Última Sessão)</h3>
          <div class="bar-chart" id="movementChart"></div>
        </div>
      </div>
      <div class="panel card">
        <h3>Atividade Recente</h3>
        <div id="recentActivity"></div>
      </div>
    </main>
  </div>
  <script src="Backend/scriptgeral.js"></script>
</body>
</html>
